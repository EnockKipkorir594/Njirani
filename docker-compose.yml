#version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: njirani-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: njirani
      POSTGRES_PASSWORD: njirani_dev_pass
      POSTGRES_DB: njirani
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U njirani -d njirani"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: njirani-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
