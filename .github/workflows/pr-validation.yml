# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  
  pull_request:
    branches: [ "development" ]



jobs:

# JOB 1: Lint
  lint:
    name: lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js 
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Run Eslint
      run: npm run lint 

      
# JOB 2: test
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: njirani
          POSTGRES_PASSWORD: njirani_dev_pass
          POSTGRES_DB: njirani_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

        ports:
          - 5432:5432
      
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://njirani:njirani_dev_pass@localhost:5432/njirani_test
        run: npx prisma generate


      - name: Setup database
        env:
          DATABASE_URL: postgresql://njirani:njirani_dev_pass@localhost:5432/njirani_test
        run: |
          npx prisma db push --accept-data-loss
          psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Run tests
        env:
          DATABASE_URL: postgresql://njirani:njirani_dev_pass@localhost:5432/njirani_test
          JWT_SECRET: test-jwt-secret-key-for-testing-only-12345
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-key-for-testing-only-67890
          JWT_EXPIRES_IN: 1h
          JWT_REFRESH_EXPIRES_IN: 7d
          NODE_ENV: test
          PORT: 8001
        run: npm test

  # JOB 3: Docker Build 
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Build Docker Image
      run: docker build -t njirani-backend:test ./backend 
