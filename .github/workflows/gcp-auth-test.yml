name: GCP Authentication Test

on:
  workflow_dispatch:

jobs:
  authenticate:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: njirani-github-deployer@njirani-prod.iam.gserviceaccount.com

      - name: Verify Google Cloud authentication
        run: |
          echo "Authenticated service account:"
          gcloud auth print-access-token >/dev/null
          echo "GCP authentication successful."