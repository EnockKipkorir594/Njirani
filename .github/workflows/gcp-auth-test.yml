name: GCP Authentication Test

on:
  workflow_dispatch:

jobs:
  authenticate:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: njirani-github-deployer@njirani-prod.iam.gserviceaccount.com

      - name: Verify GCP and Artifact Registry access
        run: |
          echo "Testing federated GCP credentials..."

          gcloud auth print-access-token > /dev/null

          echo "Testing Artifact Registry access..."

          gcloud artifacts repositories describe njirani \
            --location=africa-south1 \
            --project=njirani-prod

          echo "GCP and Artifact Registry access successful."
