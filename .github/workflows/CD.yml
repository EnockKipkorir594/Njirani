name: Njirani CD

on:
  pull_request:
    types: [closed]
    branches:
      - development

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: njirani-prod
  REGION: africa-south1
  ARTIFACT_REGISTRY_HOST: africa-south1-docker.pkg.dev
  ARTIFACT_REGISTRY_REPOSITORY: njirani
  IMAGE_NAME: backend
  CLOUD_DEPLOY_PIPELINE: njirani-backend-pipeline
  DEPLOYER_SERVICE_ACCOUNT: njirani-github-deployer@njirani-prod.iam.gserviceaccount.com
  SERVICE_URL: https://njirani-backend-189445761845.africa-south1.run.app

jobs:
  deploy:
    name: Build, Push and Deploy
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ------------------------------------------------------------
      # 1. Checkout the exact commit that was merged into development
      # ------------------------------------------------------------
      - name: Checkout merged code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      # ------------------------------------------------------------
      # 2. Authenticate GitHub Actions with Google Cloud using WIF
      # ------------------------------------------------------------
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}
          token_format: access_token

      # ------------------------------------------------------------
      # 3. Install/configure the Google Cloud CLI
      # ------------------------------------------------------------
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      # ------------------------------------------------------------
      # 4. Authenticate Docker with Artifact Registry
      # ------------------------------------------------------------
      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ARTIFACT_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # ------------------------------------------------------------
      # 5. Build the production Docker image
      # ------------------------------------------------------------
      - name: Build production image
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          IMAGE_URI="${ARTIFACT_REGISTRY_HOST}/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}:${MERGE_SHA}"

          echo "Building image:"
          echo "$IMAGE_URI"

          docker build \
            -t "$IMAGE_URI" \
            ./backend

      # ------------------------------------------------------------
      # 6. Scan the exact production image
      # ------------------------------------------------------------
      - name: Scan production image
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: africa-south1-docker.pkg.dev/njirani-prod/njirani/backend:${{ github.event.pull_request.merge_commit_sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: 'true'

      # ------------------------------------------------------------
      # 7. Push the image to Artifact Registry
      # ------------------------------------------------------------
      - name: Push image to Artifact Registry
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          IMAGE_URI="${ARTIFACT_REGISTRY_HOST}/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}:${MERGE_SHA}"

          echo "Pushing image:"
          echo "$IMAGE_URI"

          docker push "$IMAGE_URI"

      # ------------------------------------------------------------
      # 8. Resolve the pushed tag to an immutable digest
      # ------------------------------------------------------------
      - name: Resolve image digest
        id: image
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          IMAGE_URI="${ARTIFACT_REGISTRY_HOST}/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}:${MERGE_SHA}"

          DIGEST="$(
            gcloud artifacts docker images describe "$IMAGE_URI" \
              --project="$PROJECT_ID" \
              --format='value(image_summary.digest)'
          )"

          if [ -z "$DIGEST" ]; then
            echo "ERROR: Failed to resolve image digest."
            exit 1
          fi

          IMAGE_DIGEST="${ARTIFACT_REGISTRY_HOST}/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}@${DIGEST}"

          echo "Resolved immutable image:"
          echo "$IMAGE_DIGEST"

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 9. Create a Cloud Deploy release
      # ------------------------------------------------------------
      - name: Create Cloud Deploy release
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
        run: |
          RELEASE_NAME="njirani-${MERGE_SHA:0:7}"

          echo "Creating Cloud Deploy release:"
          echo "$RELEASE_NAME"

          gcloud deploy releases create "$RELEASE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --delivery-pipeline="$CLOUD_DEPLOY_PIPELINE" \
            --source="backend/deploy" \
            --images="backend-image=$IMAGE_DIGEST" \
            --annotations="commitId=$MERGE_SHA,pullRequest=$PR_NUMBER"

          echo "RELEASE_NAME=$RELEASE_NAME" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 10. Wait for the Cloud Deploy rollout to finish
      # ------------------------------------------------------------
      - name: Wait for Cloud Deploy rollout
        run: |
          echo "Finding rollout for release $RELEASE_NAME..."

          ROLLOUT_RESOURCE="$(
            gcloud deploy rollouts list \
              --delivery-pipeline="$CLOUD_DEPLOY_PIPELINE" \
              --release="$RELEASE_NAME" \
              --region="$REGION" \
              --project="$PROJECT_ID" \
              --limit=1 \
              --sort-by='~createTime' \
              --format='value(name)'
          )"

          if [ -z "$ROLLOUT_RESOURCE" ]; then
            echo "ERROR: No rollout found for release $RELEASE_NAME."
            exit 1
          fi

          ROLLOUT_NAME="${ROLLOUT_RESOURCE##*/}"

          echo "Rollout: $ROLLOUT_NAME"

          for attempt in {1..60}; do
            STATE="$(
              gcloud deploy rollouts describe "$ROLLOUT_NAME" \
                --delivery-pipeline="$CLOUD_DEPLOY_PIPELINE" \
                --release="$RELEASE_NAME" \
                --region="$REGION" \
                --project="$PROJECT_ID" \
                --format='value(state)'
            )"

            echo "Rollout state: $STATE"

            case "$STATE" in
              SUCCEEDED)
                echo "Cloud Deploy rollout succeeded."
                exit 0
                ;;

              FAILED|CANCELLED|CANCELLING|APPROVAL_REJECTED|HALTED)
                echo "Cloud Deploy rollout failed with state: $STATE"
                exit 1
                ;;

              *)
                sleep 10
                ;;
            esac
          done

          echo "ERROR: Timed out waiting for Cloud Deploy rollout."
          exit 1

      # ------------------------------------------------------------
      # 11. Verify the deployed API
      # ------------------------------------------------------------
      - name: Verify deployed API
        run: |
          echo "Checking:"
          echo "$SERVICE_URL"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-connrefused \
            "$SERVICE_URL"

          echo
          echo "Njirani API deployment verified successfully."